/* ===== ERROR DIKHANE WALA (screen par laal box) - login/file ka masla yahan nazar aayega ===== */

        box.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:100000;background:#b00020;color:#fff;font:12px sans-serif;padding:10px;border-radius:10px;max-height:35vh;overflow:auto;white-space:pre-wrap';

      }

    }catch(e){}
  }
  window.addEventListener('error',function(e){
    var t=e.target;
    if(t&&t!==window&&(t.src||t.href)){show('File load nahi hui: '+(t.src||t.href));return}
    show('Error: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')');
  },true);

/* ===== FT 8K FILTER - NAME: FT PARI FILTER ✨ (ab upar top-level par, safe) ===== */
window.ftFilterOn = false;
window.ftFilterRun = false;
window.apply8KBeautyFilter = function(video) {
    if(window.ftFilterOn || !video) return; // ek bar hi
    window.ftFilterOn = true;
    window.ftFilterRun = true;
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    var container = video.parentElement;
    container.style.position = 'relative';
    canvas.style.position = 'absolute';
    canvas.style.top = '0'; canvas.style.left = '0';
    canvas.style.width = '100%'; canvas.style.height = '100%';
    canvas.style.zIndex = '5';
    canvas.setAttribute('data-ftfilter','1');
    container.appendChild(canvas);

    function frame() {
        if(!window.ftFilterRun) return; // filter band to loop band
        if(video.paused) { requestAnimationFrame(frame); return; }
        canvas.width = video.videoWidth || 400;
        canvas.height = video.videoHeight || 700;
        ctx.filter = 'contrast(1.15) saturate(1.25) brightness(1.08)';
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        // Face smooth + white
        var x = canvas.width*0.2, y = canvas.height*0.15, w = canvas.width*0.6, h = canvas.height*0.6;
        ctx.globalCompositeOperation = 'soft-light';
        ctx.filter = 'blur(7px) brightness(1.35)';
        ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'none';
        // Makeup - pink lips + blush
        ctx.fillStyle = 'rgba(255,105,180,0.16)';
        ctx.beginPath(); ctx.ellipse(canvas.width/2, canvas.height*0.65, w*0.12, h*0.06, 0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,182,193,0.18)';
        ctx.beginPath(); ctx.ellipse(canvas.width*0.35, canvas.height*0.55, w*0.12, h*0.08, 0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(canvas.width*0.65, canvas.height*0.55, w*0.12, h*0.08, 0,0,Math.PI*2); ctx.fill();
        requestAnimationFrame(frame);
    }
    frame();
    var b = document.getElementById('filterBtnName'); if(b) b.innerText = 'FT PARI ON ✨';
    if(typeof window.toast === 'function') window.toast('FT PARI FILTER ON - 8K HD');
};
window.remove8KFilter = function() {
    window.ftFilterRun = false;
    document.querySelectorAll('canvas[data-ftfilter]').forEach(function(c){ c.remove(); });
    window.ftFilterOn = false;
    var b = document.getElementById('filterBtnName'); if(b) b.innerText = 'FT PARI ✨';
    if(typeof window.toast === 'function') window.toast('Filter OFF');
};

/* ===== NEW ADD-ON (is file ke andar hi): video dabane par Save + share menu icons ===== */

      var a=document.createElement('a');a.href=URL.createObjectURL(b);

      '<button id="ftSv" style="width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#1ed760;color:#000">💾 Save video</button>'+
      '<button id="ftCx" style="width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:16px;font-weight:700;background:#2a2a2a;color:#fff">✖ Cancel</button></div>';

    s.onclick=function(e){if(e.target===s)closeSheet()};
    document.getElementById('ftCx').onclick=closeSheet;
    document.getElementById('ftSv').onclick=function(){saveVideo(v);closeSheet()};
  }
  function cancel(){clearTimeout(timer);timer=null}
  document.addEventListener('pointerdown',function(e){

    var v=videoAt(e.clientX,e.clientY);if(!v)return;
    sx=e.clientX;sy=e.clientY;cancel();
    timer=setTimeout(function(){timer=null;swallow=true;if(navigator.vibrate)navigator.vibrate(40);openSheet(v)},HOLD);
  },true);

  ['pointerup','pointercancel','scroll','touchmove'].forEach(function(n){document.addEventListener(n,cancel,true)});
  document.addEventListener('click',function(e){
    if(swallow){
      swallow=false;
      if(e.target.closest&&e.target.closest('input,textarea,select,label,form'))return; /* FIX: login fields par kabhi block nahi */
      e.stopPropagation();e.preventDefault();
    }
  },true);
  document.addEventListener('contextmenu',function(e){if(videoAt(e.clientX,e.clientY))e.preventDefault()},true);

  /* ---- 2) Share menu: har option ke saath uska icon ---- */
  var IC={'report':'🚩','repost':'🔁','download':'⬇️','save':'💾','save video':'💾','whatsapp':'🟢','twitter':'🐦','x':'✖️','facebook':'📘','instagram':'📸','copy link':'🔗','copy':'🔗','link':'🔗','message':'💬','send to':'📤','not interested':'🚫','duet':'👥','stitch':'✂️','share':'📤','telegram':'✈️','sms':'💬'};
  var EMO=/[\u2190-\u2BFF\u{1F000}-\u{1FFFF}]/u;
  function hasIcon(el){
    var p=el.parentElement;if(!p)return true;
    if(p.querySelector('svg,img,i,canvas'))return true;
    var t=(p.textContent||'').replace(el.textContent,'');
    return EMO.test(t)||EMO.test(el.textContent);
  }
  function decorate(root){
    var all=root.querySelectorAll?root.querySelectorAll('div,span,p,button,li,a,b'):[];
    for(var i=0;i<all.length;i++){
      var el=all[i];
      if(el.dataset.fti||el.children.length)continue;
      var txt=(el.textContent||'').trim().toLowerCase();
      if(!txt||txt.length>18||!IC.hasOwnProperty(txt))continue;
      el.dataset.fti='1';
      if(hasIcon(el))continue;
      var sp=document.createElement('span');sp.textContent=IC[txt];
      sp.style.cssText='font-size:1.35em;margin-right:7px;vertical-align:middle;pointer-events:none';
      el.insertBefore(sp,el.firstChild);
    }
  }
  var pend=false;
  function startObs(){
    if(!document.body)return;
    try{
      new MutationObserver(function(){if(pend)return;pend=true;setTimeout(function(){pend=false;try{decorate(document.body)}catch(e){}},120)})
        .observe(document.body,{childList:true,subtree:true});
      decorate(document.body);
    }catch(e){}
  }
  if(document.body)startObs();else document.addEventListener('DOMContentLoaded',startObs);
}.toString()+')();';

  document.head.appendChild(st);

  function toggle(m,k){
    var a=Array.isArray(m.following)?m.following:(m.following=[]),i=a.map(ky).indexOf(k);

  function openList(tab){

      h+='</div><input id="ftXq" placeholder="Search" value="'+esc(q)+'"><div class="l">';
      var a=lst(m,tab).filter(function(u){return (String(u.name||'')+' '+String(u.username||'')).toLowerCase().indexOf(q.toLowerCase())>-1});
      if(!a.length)h+='<p style="text-align:center;color:#888;padding:40px">Abhi koi nahi</p>';
      a.forEach(function(u){
        var f=fo.indexOf(kid(u))>-1,fr=f&&fl.indexOf(kid(u))>-1;
        h+='<div class="r">'+av(u,52)+'<div class="n"><b>'+esc(u.name||u.username||'User')+'</b><small>'+(u.username?'@'+esc(u.username):'')+'</small></div><button class="b'+(f?'':' p')+'" data-k="'+esc(kid(u))+'">'+(fr?'Friends':f?'Following':tab==='followers'?'Follow back':'Follow')+'</button></div>';
      });
      el.innerHTML=h+'</div>';
      el.querySelector('#ftXb').onclick=function(){el.remove()};
      [].forEach.call(el.querySelectorAll('.t div'),function(d){d.onclick=function(){tab=d.getAttribute('data-t');draw()}});
      var qi=el.querySelector('#ftXq');
      qi.oninput=function(){q=qi.value;var p=qi.selectionStart;draw();var n=el.querySelector('#ftXq');n.focus();n.setSelectionRange(p,p)};
      [].forEach.call(el.querySelectorAll('.b'),function(b){b.onclick=function(){toggle(m,b.getAttribute('data-k'));draw()}});

  function likes(n){
