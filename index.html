<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FACT TOK</title></head>
<body style="background:#000;color:#fff;font-family:sans-serif"><p style="padding:20px">Loading FACT TOK...</p>
<script>
/* ===== ERROR DIKHANE WALA (screen par laal box) - login/file ka masla yahan nazar aayega ===== */
var ERRBOX='('+function(){
  var box=null;
  function show(m){
    try{
      if(!box){
        box=document.createElement('div');
        box.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:100000;background:#b00020;color:#fff;font:12px sans-serif;padding:10px;border-radius:10px;max-height:35vh;overflow:auto;white-space:pre-wrap';
        box.onclick=function(){box.remove();box=null};
        (document.body||document.documentElement).appendChild(box);
      }
      box.textContent+=m+'\n';
    }catch(e){}
  }
  window.addEventListener('error',function(e){
    var t=e.target;
    if(t&&t!==window&&(t.src||t.href)){show('File load nahi hui: '+(t.src||t.href));return}
    show('Error: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')');
  },true);
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;show('Promise error: '+((r&&(r.code||r.message))||r));
  });
}.toString()+')();';

/* ===== FT 8K FILTER - NAME: FT PARI FILTER ✨ (ab upar top-level par, safe) ===== */
window.ftFilterOn = false;
window.ftFilterRun = false;
window.apply8KBeautyFilter = function(video) {
    if(window.ftFilterOn || !video) return; // ek bar hi
    window.ftFilterOn = true;
    window.ftFilterRun = true;
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    var container = video.parentElement;
    container.style.position = 'relative';
    canvas.style.position = 'absolute';
    canvas.style.top = '0'; canvas.style.left = '0';
    canvas.style.width = '100%'; canvas.style.height = '100%';
    canvas.style.zIndex = '5';
    canvas.setAttribute('data-ftfilter','1');
    container.appendChild(canvas);

    function frame() {
        if(!window.ftFilterRun) return; // filter band to loop band
        if(video.paused) { requestAnimationFrame(frame); return; }
        canvas.width = video.videoWidth || 400;
        canvas.height = video.videoHeight || 700;
        ctx.filter = 'contrast(1.15) saturate(1.25) brightness(1.08)';
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        // Face smooth + white
        var x = canvas.width*0.2, y = canvas.height*0.15, w = canvas.width*0.6, h = canvas.height*0.6;
        ctx.globalCompositeOperation = 'soft-light';
        ctx.filter = 'blur(7px) brightness(1.35)';
        ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'none';
        // Makeup - pink lips + blush
        ctx.fillStyle = 'rgba(255,105,180,0.16)';
        ctx.beginPath(); ctx.ellipse(canvas.width/2, canvas.height*0.65, w*0.12, h*0.06, 0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,182,193,0.18)';
        ctx.beginPath(); ctx.ellipse(canvas.width*0.35, canvas.height*0.55, w*0.12, h*0.08, 0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(canvas.width*0.65, canvas.height*0.55, w*0.12, h*0.08, 0,0,Math.PI*2); ctx.fill();
        requestAnimationFrame(frame);
    }
    frame();
    var b = document.getElementById('filterBtnName'); if(b) b.innerText = 'FT PARI ON ✨';
    if(typeof window.toast === 'function') window.toast('FT PARI FILTER ON - 8K HD');
};
window.remove8KFilter = function() {
    window.ftFilterRun = false;
    document.querySelectorAll('canvas[data-ftfilter]').forEach(function(c){ c.remove(); });
    window.ftFilterOn = false;
    var b = document.getElementById('filterBtnName'); if(b) b.innerText = 'FT PARI ✨';
    if(typeof window.toast === 'function') window.toast('Filter OFF');
};

/* ===== NEW ADD-ON (is file ke andar hi): video dabane par Save + share menu icons ===== */
var MORE='('+function(){
  /* ---- 1) Video ko 2 second dabaye rakhne par Save option ---- */
  var HOLD=2000,timer=null,sx=0,sy=0,swallow=false;
  function videoAt(x,y){
    var list=document.elementsFromPoint(x,y);
    for(var i=0;i<list.length;i++){if(list[i].tagName==='VIDEO')return list[i]}
    return null;
  }
  function closeSheet(){var s=document.getElementById('ftSaveSheet');if(s)s.remove()}
  function saveVideo(v){
    var src=v.currentSrc||v.src;
    if(!src){alert('Video ka link nahi mila');return}
    fetch(src).then(function(r){return r.blob()}).then(function(b){
      var a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download='fact-tok-'+Date.now()+'.mp4';document.body.appendChild(a);a.click();a.remove();
    }).catch(function(){window.open(src,'_blank')});
  }
  function openSheet(v){
    closeSheet();
    var s=document.createElement('div');s.id='ftSaveSheet';
    s.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.55);display:flex;align-items:flex-end';
    s.innerHTML='<div style="width:100%;background:#1c1c1c;border-radius:18px 18px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px)">'+
      '<div style="width:40px;height:4px;border-radius:2px;background:#555;margin:0 auto 14px"></div>'+
      '<button id="ftSv" style="width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#1ed760;color:#000">💾 Save video</button>'+
      '<button id="ftCx" style="width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:16px;font-weight:700;background:#2a2a2a;color:#fff">✖ Cancel</button></div>';
    document.body.appendChild(s);
    s.onclick=function(e){if(e.target===s)closeSheet()};
    document.getElementById('ftCx').onclick=closeSheet;
    document.getElementById('ftSv').onclick=function(){saveVideo(v);closeSheet()};
  }
  function cancel(){clearTimeout(timer);timer=null}
  document.addEventListener('pointerdown',function(e){
    swallow=false; /* FIX: purana swallow login/button click ko block na kare */
    if(e.target.closest&&e.target.closest('button,a,input,textarea,select,label,#ftSaveSheet'))return;
    var v=videoAt(e.clientX,e.clientY);if(!v)return;
    sx=e.clientX;sy=e.clientY;cancel();
    timer=setTimeout(function(){timer=null;swallow=true;if(navigator.vibrate)navigator.vibrate(40);openSheet(v)},HOLD);
  },true);
  document.addEventListener('pointermove',function(e){if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>12)cancel()},true);
  ['pointerup','pointercancel','scroll','touchmove'].forEach(function(n){document.addEventListener(n,cancel,true)});
  document.addEventListener('click',function(e){
    if(swallow){
      swallow=false;
      if(e.target.closest&&e.target.closest('input,textarea,select,label,form'))return; /* FIX: login fields par kabhi block nahi */
      e.stopPropagation();e.preventDefault();
    }
  },true);
  document.addEventListener('contextmenu',function(e){if(videoAt(e.clientX,e.clientY))e.preventDefault()},true);

  /* ---- 2) Share menu: har option ke saath uska icon ---- */
  var IC={'report':'🚩','repost':'🔁','download':'⬇️','save':'💾','save video':'💾','whatsapp':'🟢','twitter':'🐦','x':'✖️','facebook':'📘','instagram':'📸','copy link':'🔗','copy':'🔗','link':'🔗','message':'💬','send to':'📤','not interested':'🚫','duet':'👥','stitch':'✂️','share':'📤','telegram':'✈️','sms':'💬'};
  var EMO=/[\u2190-\u2BFF\u{1F000}-\u{1FFFF}]/u;
  function hasIcon(el){
    var p=el.parentElement;if(!p)return true;
    if(p.querySelector('svg,img,i,canvas'))return true;
    var t=(p.textContent||'').replace(el.textContent,'');
    return EMO.test(t)||EMO.test(el.textContent);
  }
  function decorate(root){
    var all=root.querySelectorAll?root.querySelectorAll('div,span,p,button,li,a,b'):[];
    for(var i=0;i<all.length;i++){
      var el=all[i];
      if(el.dataset.fti||el.children.length)continue;
      var txt=(el.textContent||'').trim().toLowerCase();
      if(!txt||txt.length>18||!IC.hasOwnProperty(txt))continue;
      el.dataset.fti='1';
      if(hasIcon(el))continue;
      var sp=document.createElement('span');sp.textContent=IC[txt];
      sp.style.cssText='font-size:1.35em;margin-right:7px;vertical-align:middle;pointer-events:none';
      el.insertBefore(sp,el.firstChild);
    }
  }
  var pend=false;
  function startObs(){
    if(!document.body)return;
    try{
      new MutationObserver(function(){if(pend)return;pend=true;setTimeout(function(){pend=false;try{decorate(document.body)}catch(e){}},120)})
        .observe(document.body,{childList:true,subtree:true});
      decorate(document.body);
    }catch(e){}
  }
  if(document.body)startObs();else document.addEventListener('DOMContentLoaded',startObs);
}.toString()+')();';

/* ===== LOADER: app.html ko load karke page me lagata hai ===== */
if(location.protocol==='file:'){
  document.body.innerHTML='<p style="padding:20px">Ye file seedha phone se mat kholo. Isay GitHub Pages / hosting link se kholo, warna login nahi chalega.</p>';
}else{
fetch('app.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(h){
  /* official ID patch - ab CONFIG na ho ya adminGmail khali ho to bhi crash/galat verify nahi hoga */
  var G="(typeof CONFIG!=='undefined'&&CONFIG.adminGmail&&u.email===CONFIG.adminGmail)";
  [["const verified=u=>u.verified||(","const verified=u=>u.verified||"+G+"||("],
   ["' <span title=\"Verified\" style=\"color:#20d5ec\">✅</span>'","("+G+"?' <span title=\"Official FACT TOK account\" style=\"color:#1ed760\">✅ Official</span>':' <span title=\"Verified\" style=\"color:#20d5ec\">✅</span>')"]
  ].forEach(function(p){if(h.indexOf(p[0])>-1)h=h.replace(p[0],function(){return p[1]});else console.warn('FT patch skipped:',p[0])});

  /* ft-extra.js + ft-ui.js + ft-withdraw.js + camera (cloud se pehle). ?v=2 = purani cache se bachne ke liye */
  var EXTRA='<script>'+ERRBOX+'<\/script><script src="ft-extra.js?v=2"><\/script><script src="ft-ui.js?v=2"><\/script><script src="ft-withdraw.js?v=5"><\/script><script>(function(){function c(){var a=document.getElementById("ftCamFrame");if(a)a.remove();var b=document.getElementById("ftCamX");if(b)b.remove()}function o(){c();var f=document.createElement("iframe");f.id="ftCamFrame";f.src="ft-camera.html";f.allow="camera;microphone;autoplay";f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9999;background:#000";document.body.appendChild(f);var x=document.createElement("button");x.id="ftCamX";x.textContent="✕";x.style.cssText="position:fixed;top:12px;right:12px;z-index:10000;width:38px;height:38px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:16px";x.onclick=c;document.body.appendChild(x)}window.openUpload=window.openCamera=o;window.ftCloseCam=c;addEventListener("message",function(e){if(e.data==="ftclose")c()})})();<\/script>';
  var TAIL=EXTRA+'<script>'+MORE+'<\/script><script type="module" src="facttok-cloud.js?v=2"><\/script>';
  if(h.indexOf('</body>')>-1)h=h.replace('</body>',function(){return TAIL+'</body>'});
  else h=h+TAIL; /* agar app.html me </body> na ho to bhi scripts lagengi */
  document.open();document.write(h);document.close();
}).catch(function(){document.body.innerHTML='<p style="padding:20px">app.html not found. Upload app.html next to this file.</p>'});
}
</script></body></html>
