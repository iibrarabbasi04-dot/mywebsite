<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FACT TOK</title></head>
<body style="background:#000;color:#fff;font-family:sans-serif"><p style="padding:20px">Loading FACT TOK...</p>
<script>
fetch('app.html').then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(h){
  /* NEW: official ID patch (fact-new.html se) */
  [["const verified=u=>u.verified||(","const verified=u=>u.verified||u.email===CONFIG.adminGmail||("],
   ["' <span title=\"Verified\" style=\"color:#20d5ec\">✅</span>'","(u.email===CONFIG.adminGmail?' <span title=\"Official FACT TOK account\" style=\"color:#1ed760\">✅ Official</span>':' <span title=\"Verified\" style=\"color:#20d5ec\">✅</span>')"]
  ].forEach(function(p){if(h.indexOf(p[0])>-1)h=h.replace(p[0],function(){return p[1]});else console.warn('FT patch skipped:',p[0])});
  /* NEW: ft-extra.js ka script tag (cloud se pehle) + ft-ui.js (naya design) */
  h=h.replace('</body>','<script src="ft-extra.js?v=1"><\/script><script src="ft-ui.js?v=1"><\/script><script>(function(){function c(){var a=document.getElementById("ftCamFrame");if(a)a.remove();var b=document.getElementById("ftCamX");if(b)b.remove()}function o(){c();var f=document.createElement("iframe");f.id="ftCamFrame";f.src="ft-camera.html";f.allow="camera;microphone;autoplay";f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9999;background:#000";document.body.appendChild(f);var x=document.createElement("button");x.id="ftCamX";x.textContent="✕";x.style.cssText="position:fixed;top:12px;right:12px;z-index:10000;width:38px;height:38px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:16px";x.onclick=c;document.body.appendChild(x)}window.openUpload=window.openCamera=o;window.ftCloseCam=c;addEventListener("message",function(e){if(e.data==="ftclose")c()})})();<\/script><script type="module" src="facttok-cloud.js"><\/script></body>');
  document.open();document.write(h)// ===== FT 8K FILTER - NAME: FT PARI FILTER ✨ =====
window.ftFilterOn = false;
window.apply8KBeautyFilter = function(video) {
    if(window.ftFilterOn) return; // ek bar hi
    window.ftFilterOn = true;
    let canvas = document.createElement('canvas');
    let ctx = canvas.getContext('2d');
    let container = video.parentElement;
    container.style.position = 'relative';
    canvas.style.position = 'absolute';
    canvas.style.top = '0'; canvas.style.left = '0';
    canvas.style.width = '100%'; canvas.style.height = '100%';
    canvas.style.zIndex = '5';
    container.appendChild(canvas);
    
    function frame() {
        if(video.paused) { requestAnimationFrame(frame); return; }
        canvas.width = video.videoWidth || 400;
        canvas.height = video.videoHeight || 700;
        ctx.filter = 'contrast(1.15) saturate(1.25) brightness(1.08)';
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        // Face smooth + white
        let x = canvas.width*0.2, y = canvas.height*0.15, w = canvas.width*0.6, h = canvas.height*0.6;
        ctx.globalCompositeOperation = 'soft-light';
        ctx.filter = 'blur(7px) brightness(1.35)';
        ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'none';
        // Makeup - pink lips + blush
        ctx.fillStyle = 'rgba(255,105,180,0.16)';
        ctx.beginPath(); ctx.ellipse(canvas.width/2, canvas.height*0.65, w*0.12, h*0.06, 0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,182,193,0.18)';
        ctx.beginPath(); ctx.ellipse(canvas.width*0.35, canvas.height*0.55, w*0.12, h*0.08, 0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(canvas.width*0.65, canvas.height*0.55, w*0.12, h*0.08, 0,0,Math.PI*2); ctx.fill();
        requestAnimationFrame(frame);
    }
    frame();
    document.getElementById('filterBtnName').innerText = 'FT PARI ON ✨';
    toast('FT PARI FILTER ON - 8K HD');
}
window.remove8KFilter = function() {
    document.querySelectorAll('canvas').forEach(c=>{ if(c.style.zIndex=='5') c.remove(); });
    window.ftFilterOn = false;
    document.getElementById('filterBtnName').innerText = 'FT PARI ✨';
    toast('Filter OFF');
  };document.close();
}).catch(function(){document.body.innerHTML='<p style="padding:20px">app.html not found. Upload app.html next to this file.</p>'});
</script></body></html>
