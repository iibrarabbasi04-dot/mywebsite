/* ===== FT 8K FILTER - NAME: FT PARI FILTER ✨ (ab upar top-level par, safe) ===== */
window.ftFilterOn = false;
window.ftFilterRun = false;
window.apply8KBeautyFilter = function(video) {
    if(window.ftFilterOn || !video) return; // ek bar hi
    window.ftFilterOn = true;
    window.ftFilterRun = true;
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    var container = video.parentElement;
    container.style.position = 'relative';
    canvas.style.position = 'absolute';
    canvas.style.top = '0'; canvas.style.left = '0';
    canvas.style.width = '100%'; canvas.style.height = '100%';
    canvas.style.zIndex = '5';
    canvas.setAttribute('data-ftfilter','1');
    container.appendChild(canvas);

    function frame() {
        if(!window.ftFilterRun) return; // filter band to loop band
        if(video.paused) { requestAnimationFrame(frame); return; }
        canvas.width = video.videoWidth || 400;
        canvas.height = video.videoHeight || 700;
        ctx.filter = 'contrast(1.15) saturate(1.25) brightness(1.08)';
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        // Face smooth + white
        var x = canvas.width*0.2, y = canvas.height*0.15, w = canvas.width*0.6, h = canvas.height*0.6;
        ctx.globalCompositeOperation = 'soft-light';
        ctx.filter = 'blur(7px) brightness(1.35)';
        ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'none';
        // Makeup - pink lips + blush
        ctx.fillStyle = 'rgba(255,105,180,0.16)';
        ctx.beginPath(); ctx.ellipse(canvas.width/2, canvas.height*0.65, w*0.12, h*0.06, 0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,182,193,0.18)';
        ctx.beginPath(); ctx.ellipse(canvas.width*0.35, canvas.height*0.55, w*0.12, h*0.08, 0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(canvas.width*0.65, canvas.height*0.55, w*0.12, h*0.08, 0,0,Math.PI*2); ctx.fill();
        requestAnimationFrame(frame);
    }
    frame();
    var b = document.getElementById('filterBtnName'); if(b) b.innerText = 'FT PARI ON ✨';
    if(typeof window.toast === 'function') window.toast('FT PARI FILTER ON - 8K HD');
};
window.remove8KFilter = function() {
    window.ftFilterRun = false;
    document.querySelectorAll('canvas[data-ftfilter]').forEach(function(c){ c.remove(); });
    window.ftFilterOn = false;
    var b = document.getElementById('filterBtnName'); if(b) b.innerText = 'FT PARI ✨';
    if(typeof window.toast === 'function') window.toast('Filter OFF');
};
