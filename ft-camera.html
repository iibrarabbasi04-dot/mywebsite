<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FACT TOK Camera</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{position:relative;flex:1;margin:calc(env(safe-area-inset-top,0px) + 8px) 6px 0;border-radius:18px;overflow:hidden;background:#111;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:3}
#sound{background:rgba(0,0,0,.4);border-radius:22px;padding:10px 16px;font-weight:700}
#side{position:absolute;right:10px;top:70px;display:flex;flex-direction:column;gap:12px;z-index:3;align-items:center}
.lb{font-size:11px;text-align:center;margin-top:-6px}
#prog{position:absolute;top:0;left:0;height:4px;background:#1ed760;width:0;z-index:4}
#cd{position:absolute;inset:0;display:none;place-items:center;font-size:110px;font-weight:800;z-index:5;background:rgba(0,0,0,.25)}
#modes{display:flex;justify-content:center;gap:18px;padding:12px 0 6px;font-weight:700;color:#bbb}
#modes span{padding:6px 12px;border-radius:20px;cursor:pointer}
#modes .on{background:#fff;color:#000}
#car{position:relative;height:100px;display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - 40px)}
#car::-webkit-scrollbar{display:none}
.fx{flex:0 0 auto;scroll-snap-align:center;width:56px;height:56px;margin:0 12px;border-radius:50%;border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:10px;font-weight:700;text-align:center;line-height:1.1;transition:transform .15s;cursor:pointer;text-shadow:0 1px 2px #000}
.fx.sel{width:80px;height:80px;margin:0 6px;border:5px solid #fff;font-size:12px}
.fx.sel.rec{border-color:#fff;box-shadow:inset 0 0 0 5px #000}
body.recording .fx.sel{border-radius:22px;border-color:#ff2d55}
#fxname{text-align:center;height:18px;font-size:13px;color:#ddd}
#bot{display:flex;justify-content:space-between;align-items:center;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 14px);gap:12px}
#gal{width:44px;height:44px;border-radius:8px;border:2px solid #fff;background:#333;overflow:hidden;display:grid;place-items:center;cursor:pointer}
#all{flex:1;background:#2a2a2a;border:0;color:#fff;border-radius:26px;padding:14px;font-weight:700;font-size:15px;cursor:pointer}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;background:#161616;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s;z-index:20;padding:14px;overflow:auto}
#sheet.open{transform:none}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:10px}
#grid div{text-align:center;font-size:12px;cursor:pointer}
#grid i{display:block;width:62px;height:62px;border-radius:50%;margin:0 auto 4px;border:2px solid transparent}
#grid .sel i{border-color:#1ed760}
#rev{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#rev video,#rev img{flex:1;min-height:0;width:100%;object-fit:contain}
#rev .b{display:flex;gap:12px;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.btn{flex:1;border:0;border-radius:26px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;background:#2a2a2a;color:#fff}
.btn.p{background:#1ed760;color:#04200d}
#txtm{position:absolute;inset:0;display:none;z-index:2;background:linear-gradient(160deg,#1ed760,#0a3d1f);place-items:center;padding:30px}
#txtm textarea{width:100%;height:50%;background:transparent;border:0;color:#fff;font-size:30px;font-weight:800;text-align:center;resize:none;outline:0}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 16px;border-radius:20px;z-index:40;display:none}
button:focus-visible{outline:2px solid #1ed760}
</style></head><body>
<div id="app">
 <div id="view">
  <canvas id="cv" width="720" height="1280"></canvas><div id="prog"></div><div id="cd"></div>
  <div id="txtm"><textarea id="txta" placeholder="Type something…" maxlength="200"></textarea></div>
  <div id="top"><button class="ib" id="close" aria-label="Close">✕</button><div id="sound">♪ Add sound</div><span style="width:42px"></span></div>
  <div id="side">
   <button class="ib" id="flip" aria-label="Flip camera">🔄</button>
   <button class="ib" id="flash" aria-label="Flash">⚡</button>
   <button class="ib" id="timer" aria-label="Timer">⏱</button><div class="lb" id="tl">Off</div>
   <button class="ib" id="chev" aria-label="More">⌃</button>
   <div id="more" style="display:flex;flex-direction:column;gap:12px;align-items:center">
   <button class="ib" id="layout" aria-label="Layout">▥</button>
   <button class="ib" id="zoom" aria-label="Zoom" style="font-size:13px;font-weight:700">1x</button>
   <button class="ib" id="qual" aria-label="Quality" style="font-size:12px;font-weight:700">FHD</button>
   <button class="ib" id="beauty" aria-label="Beauty">✨</button><div class="lb" id="bl">Beauty</div></div>
  </div>
 </div>
 <div id="modes"><span data-m="600">10m</span><span data-m="60">60s</span><span data-m="15" class="on">15s</span><span data-m="0">PHOTO</span><span data-m="-1">TEXT</span></div>
 <div id="fxname"></div>
 <div id="car"></div>
 <div id="bot"><label id="gal" for="gf">🖼<input id="gf" type="file" accept="video/*,image/*" hidden></label><button id="all">All effects</button><button class="ib" id="reset" aria-label="Reset effect" style="background:#fff;color:#000">✕</button></div>
 <div id="sheet"><b>All effects</b><div id="grid"></div></div>
</div>
<div id="rev"><div id="revc" style="flex:1;display:flex;min-height:0"></div><div class="b"><button class="btn" id="retake">Retake</button><button class="btn p" id="save">Save</button></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const vid=document.createElement('video');vid.muted=true;vid.playsInline=true;
// ---- 24 new effects: n=name, f=canvas filter, o=overlay, t=tint, c=swatch ----
const E=[
{n:'Normal',f:'',c:'#888'},
{n:'Pari',f:'contrast(1.1) saturate(1.2) brightness(1.1)',o:'blush',m:{l:'rgba(255,90,150,.45)',b:'rgba(255,120,160,.3)'},b:.6,c:'#ff8fb8'},
{n:'Glow',f:'brightness(1.12) saturate(1.15)',o:'glow',c:'#ffd9a0'},
{n:'Clean',f:'brightness(1.08) contrast(1.05) saturate(1.1)',c:'#bde7ff'},
{n:'Soft',f:'brightness(1.1) contrast(.92) saturate(1.05)',o:'glow',c:'#f7d6e0'},
{n:'Rose',f:'saturate(1.2) brightness(1.05)',t:'rgba(255,90,140,.18)',c:'#ff5a8c'},
{n:'Peach',f:'saturate(1.15) brightness(1.08)',t:'rgba(255,170,120,.2)',c:'#ffaa78'},
{n:'Golden',f:'sepia(.35) saturate(1.4) brightness(1.05)',t:'rgba(255,190,60,.15)',o:'vig',c:'#f5b942'},
{n:'Sunset',f:'saturate(1.5) contrast(1.1)',t:'rgba(255,100,40,.22)',c:'#ff6428'},
{n:'Cool',f:'saturate(1.1) hue-rotate(10deg)',t:'rgba(60,140,255,.18)',c:'#4c8dff'},
{n:'Ice',f:'brightness(1.1) saturate(.9) hue-rotate(15deg)',t:'rgba(150,220,255,.22)',c:'#9fdcff'},
{n:'Cinema',f:'contrast(1.3) saturate(.85) brightness(.95)',t:'rgba(0,90,110,.15)',o:'bars',c:'#1f5f6f'},
{n:'Noir',f:'grayscale(1) contrast(1.4)',o:'vig',c:'#444'},
{n:'Film',f:'sepia(.25) contrast(1.05) saturate(.9)',o:'grain',c:'#a89070'},
{n:'Fade',f:'contrast(.8) brightness(1.15) saturate(.7)',c:'#c9c3d6'},
{n:'Pastel',f:'saturate(.8) brightness(1.18) contrast(.9)',t:'rgba(200,180,255,.2)',c:'#cdb8ff'},
{n:'Dream',f:'brightness(1.12) saturate(1.3)',o:'glow',t:'rgba(255,150,255,.15)',c:'#ff9bff'},
{n:'Cyber',f:'contrast(1.25) saturate(1.6) hue-rotate(-25deg)',t:'rgba(0,255,230,.12)',o:'scan',c:'#00ffe0'},
{n:'Neon',f:'contrast(1.3) saturate(2) hue-rotate(290deg)',o:'glow',c:'#d400ff'},
{n:'Glitch',f:'contrast(1.2) saturate(1.3)',o:'glitch',c:'#ff2d55'},
{n:'VHS',f:'saturate(1.3) contrast(1.1) blur(.6px)',o:'vhs',c:'#7a6cff'},
{n:'Sparkle',f:'brightness(1.08) saturate(1.2)',o:'spark',c:'#fff3a0'},
{n:'Hearts',f:'saturate(1.2)',t:'rgba(255,60,120,.12)',o:'hearts',c:'#ff3c78'},
{n:'Vivid',f:'saturate(1.8) contrast(1.15)',c:'#27e08a'},
{n:'Pink Makeup',f:'brightness(1.08) saturate(1.15)',m:{l:'rgba(255,60,120,.55)',b:'rgba(255,110,150,.35)',e:'rgba(255,150,200,.35)'},c:'#ff6fa5'},
{n:'Red Lips',f:'contrast(1.08) saturate(1.1)',m:{l:'rgba(215,15,40,.65)',b:'rgba(255,120,120,.2)'},c:'#d70f28'},
{n:'Nude',f:'brightness(1.06)',m:{l:'rgba(200,120,110,.5)',b:'rgba(230,150,130,.28)',e:'rgba(190,140,120,.3)'},c:'#d9a590'},
{n:'Glam',f:'contrast(1.12) saturate(1.2)',m:{l:'rgba(180,20,60,.6)',b:'rgba(255,130,100,.3)',e:'rgba(255,190,70,.45)'},c:'#e0a030'},
{n:'Plum',f:'contrast(1.1) saturate(1.15)',m:{l:'rgba(110,20,90,.6)',b:'rgba(190,80,140,.3)',e:'rgba(120,60,170,.4)'},c:'#6e145a'},
{n:'Korean',f:'brightness(1.12) saturate(1.05)',m:{l:'rgba(255,110,110,.45)',b:'rgba(255,150,140,.32)',e:'rgba(240,170,150,.3)'},c:'#ff9a8a'}];
let face=null,lm=null,layout=0,zoom=1,qi=1;const tc=document.createElement('canvas'),tctx=tc.getContext('2d');let cur=0,beauty=.5,beautyOn=true,front=true,stream=null,mode=15,rec=null,recording=false,flashOn=false,timerS=0,parts=[],lastBlob=null,isPhoto=false;
// ---- camera ----
async function cam(){
  try{if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:Q[qi][1]},height:{ideal:Math.round(Q[qi][1]*9/16)}},audio:true});
  vid.srcObject=stream;await vid.play();size();}
  catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:true});vid.srcObject=stream;await vid.play()}catch(e2){toast('Camera permission needed')}}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2000)}
function dv(){const W=cv.width,H=cv.height,vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return;const s=Math.max(W/vw,H/vh)*zoom,w=vw*s,h=vh*s;ctx.save();if(front){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(vid,(W-w)/2,(H-h)/2,w,h);ctx.restore()}
const sp=[];for(let i=0;i<40;i++)sp.push({x:Math.random(),y:Math.random(),s:Math.random()*8+3,v:Math.random()*.003+.001,p:Math.random()*6});
function star(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,d=i%2?r*.3:r;ctx.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d)}ctx.fill()}
function heart(x,y,r){ctx.beginPath();ctx.moveTo(x,y+r*.3);ctx.bezierCurveTo(x-r,y-r*.5,x-r*.5,y-r*1.2,x,y-r*.5);ctx.bezierCurveTo(x+r*.5,y-r*1.2,x+r,y-r*.5,x,y+r*.3);ctx.fill()}
function frame(t){
  const W=cv.width,H=cv.height,e=E[cur];
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
  lm=null;if(face&&vid.readyState>1){try{lm=face.detectForVideo(vid,performance.now()).faceLandmarks[0]||null}catch(_){}}
  ctx.filter=e.f||'none';dv();ctx.filter='none';
  const bs=(e.b||0)+(beautyOn?beauty:0);
  if(bs>0&&vid.videoWidth){ctx.save();ctx.beginPath();if(lm){OV.map(P).forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()}else ctx.ellipse(W/2,H*.42,W*.38,H*.3,0,0,7);ctx.clip();ctx.globalAlpha=Math.min(.75,bs*.7);ctx.filter='blur(9px) brightness(1.12)';dv();ctx.restore();ctx.filter='none'}
  if(e.t){ctx.fillStyle=e.t;ctx.fillRect(0,0,W,H)}
  if(e.m&&lm){const m=e.m,A=P(33),B=P(263),d=Math.hypot(A[0]-B[0],A[1]-B[1]);
   const sub=a=>{a.map(P).forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()};
   if(m.e)[LE,RE].forEach(a=>{const u=a.map(P);ctx.save();ctx.filter='blur('+d/30+'px)';ctx.fillStyle=m.e;ctx.beginPath();u.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));[...u].reverse().forEach(([x,y])=>ctx.lineTo(x,y-d*.14));ctx.closePath();ctx.fill();ctx.restore()});
   if(m.b)[205,425].forEach(i=>{const[x,y]=P(i),g=ctx.createRadialGradient(x,y,0,x,y,d*.32);g.addColorStop(0,m.b);g.addColorStop(1,m.b.replace(/[\d.]+\)$/,'0)'));ctx.fillStyle=g;ctx.fillRect(x-d,y-d,d*2,d*2)});
   if(m.l){ctx.save();ctx.filter='blur('+d/40+'px)';ctx.fillStyle=m.l;ctx.beginPath();sub(OL);sub(IL);ctx.fill('evenodd');ctx.restore()}}
  const o=e.o;
  if(o==='blush'&&!lm){ctx.fillStyle='rgba(255,105,150,.16)';[.33,.67].forEach(x=>{ctx.beginPath();ctx.ellipse(W*x,H*.47,W*.09,H*.04,0,0,7);ctx.fill()});ctx.beginPath();ctx.ellipse(W/2,H*.56,W*.07,H*.018,0,0,7);ctx.fill()}
  if(o==='glow'){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.35;ctx.filter='blur(14px) brightness(1.1)';dv();ctx.restore();ctx.filter='none'}
  if(o==='vig'||o==='bars'){const g=ctx.createRadialGradient(W/2,H/2,W*.35,W/2,H/2,H*.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(o==='bars'){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H*.1);ctx.fillRect(0,H*.9,W,H*.1)}
  if(o==='grain'){for(let i=0;i<250;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*.12})`;ctx.fillRect(Math.random()*W,Math.random()*H,2,2)}}
  if(o==='scan'||o==='vhs'){ctx.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<H;y+=6)ctx.fillRect(0,y,W,2)}
  if(o==='vhs'){ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(0,(t/6)%H,W,14);for(let i=0;i<120;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*.1})`;ctx.fillRect(Math.random()*W,Math.random()*H,3,1)}}
  if(o==='glitch'&&Math.random()<.35){for(let i=0;i<3;i++){const y=Math.random()*H,h=20+Math.random()*80,d=(Math.random()-.5)*50;ctx.drawImage(cv,0,y,W,h,d,y,W,h)}ctx.fillStyle='rgba(255,0,60,.12)';ctx.fillRect(0,0,W,H)}
  if(o==='spark')sp.forEach(p=>{const a=.5+.5*Math.sin(t*.004+p.p);star(p.x*W,((p.y-t*p.v)%1+1)%1*H,p.s*a*2,`rgba(255,244,170,${a})`)});
  if(o==='hearts'){ctx.fillStyle='rgba(255,60,120,.8)';sp.slice(0,18).forEach(p=>heart(p.x*W+Math.sin(t*.002+p.p)*20,((p.y-t*p.v*1.2)%1+1)%1*H,p.s*3))}
  if(layout){if(tc.width!==W){tc.width=W;tc.height=H}tctx.drawImage(cv,0,0);ctx.drawImage(tc,0,0,W,H,0,0,W,H/2);ctx.drawImage(tc,0,0,W,H,0,H/2,W,H/2)}
  requestAnimationFrame(frame)}
// ---- face tracking (MediaPipe) + quality ----
const OL=[61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185],IL=[78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191];
const LE=[33,246,161,160,159,158,157,173,133],RE=[263,466,388,387,386,385,384,398,362];
const OV=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
function P(i){const q=lm[i],W=cv.width,H=cv.height,vw=vid.videoWidth,vh=vid.videoHeight,s=Math.max(W/vw,H/vh)*zoom;let x=q.x*vw*s+(W-vw*s)/2;const y=q.y*vh*s+(H-vh*s)/2;if(front)x=W-x;return[x,y]}
async function initFace(){try{const M='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',{FaceLandmarker:F,FilesetResolver:R}=await import(M+'/vision_bundle.mjs');const fs=await R.forVisionTasks(M+'/wasm');
 face=await F.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}catch(e){toast('Face tracking load nahi hua (internet check karein)')}}
const Q=[['HD',1280],['FHD',1920],['4K',3840],['8K',7680]];
function size(){const src=Math.max(vid.videoWidth||0,vid.videoHeight||0)||Q[qi][1],H=Math.min(Q[qi][1],src)&~1,W=Math.round(H*9/16)&~1;cv.width=W;cv.height=H;if(src<Q[qi][1]-8)toast('Camera max '+src+'px — '+Q[qi][0]+' ki jagah yahi quality milegi')}
$('layout').onclick=()=>{layout=1-layout;$('layout').textContent=layout?'▤':'▥'};
$('zoom').onclick=()=>{zoom=zoom===1?1.5:zoom===1.5?2:1;$('zoom').textContent=zoom+'x'};
$('qual').onclick=()=>{qi=(qi+1)%4;$('qual').textContent=Q[qi][0];cam()};
$('chev').onclick=()=>{const m=$('more'),h=m.style.display==='none';m.style.display=h?'flex':'none';$('chev').textContent=h?'⌃':'⌄'};
// ---- carousel ----
const car=$('car');
E.forEach((e,i)=>{const d=document.createElement('div');d.className='fx';d.style.background=`radial-gradient(circle at 30% 30%,#fff6,${e.c})`;d.textContent=e.n;d.onclick=()=>pick(i,true);car.appendChild(d);
 const g=document.createElement('div');g.innerHTML=`<i style="background:radial-gradient(circle at 30% 30%,#fff6,${e.c})"></i>${e.n}`;g.onclick=()=>{pick(i,true);$('sheet').classList.remove('open')};$('grid').appendChild(g)});
function pick(i,scroll){cur=i;[...car.children].forEach((c,k)=>c.classList.toggle('sel',k===i));[...$('grid').children].forEach((c,k)=>c.classList.toggle('sel',k===i));$('fxname').textContent=E[i].n;
 if(scroll){const c=car.children[i];car.scrollTo({left:c.offsetLeft-car.clientWidth/2+c.offsetWidth/2,behavior:'smooth'})}}
let st;car.onscroll=()=>{clearTimeout(st);st=setTimeout(()=>{const mid=car.scrollLeft+car.clientWidth/2;let b=0,bd=1e9;[...car.children].forEach((c,k)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;b=k}});if(b!==cur)pick(b,false)},80)};
car.addEventListener('click',e=>{const c=e.target.closest('.fx');if(c&&c.classList.contains('sel'))shutter()});
$('all').onclick=()=>$('sheet').classList.add('open');$('view').onclick=()=>$('sheet').classList.remove('open');
$('reset').onclick=()=>{pick(0,true)};
// ---- controls ----
$('flip').onclick=()=>{front=!front;cam()};
$('flash').onclick=async()=>{try{const tr=stream.getVideoTracks()[0];flashOn=!flashOn;await tr.applyConstraints({advanced:[{torch:flashOn}]});toast(flashOn?'Flash on':'Flash off')}catch(e){flashOn=false;toast('Flash not available on this camera')}};
$('timer').onclick=()=>{timerS=timerS===0?3:timerS===3?10:0;$('tl').textContent=timerS?timerS+'s':'Off'};
$('beauty').onclick=()=>{beautyOn=!beautyOn;$('bl').textContent=beautyOn?'Beauty':'Beauty off'};
$('close').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());history.length>1?history.back():toast('Closed')};
document.querySelectorAll('#modes span').forEach(s=>s.onclick=()=>{document.querySelectorAll('#modes span').forEach(x=>x.classList.remove('on'));s.classList.add('on');mode=+s.dataset.m;$('txtm').style.display=mode===-1?'grid':'none'});
// ---- shoot ----
async function shutter(){
  if(recording){stopRec();return}
  if(mode===-1){toast('Text post ready — connect to Post screen');return}
  if(timerS){const c=$('cd');c.style.display='grid';for(let i=timerS;i>0;i--){c.textContent=i;await new Promise(r=>setTimeout(r,1000))}c.style.display='none'}
  if(mode===0){cv.toBlob(b=>show(b,true),'image/jpeg',.95);return}
  startRec()}
function startRec(){
  const cs=cv.captureStream(30);stream.getAudioTracks().forEach(t=>cs.addTrack(t));
  const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  parts=[];rec=new MediaRecorder(cs,{mimeType:mt,videoBitsPerSecond:[6e6,12e6,35e6,80e6][qi]});rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  rec.onstop=()=>show(new Blob(parts,{type:'video/webm'}),false);rec.start(500);recording=true;document.body.classList.add('recording');
  const t0=Date.now();rec._i=setInterval(()=>{const s=(Date.now()-t0)/1000;$('prog').style.width=Math.min(100,s/mode*100)+'%';if(s>=mode)stopRec()},100)}
function stopRec(){if(!recording)return;recording=false;clearInterval(rec._i);rec.stop();document.body.classList.remove('recording');$('prog').style.width='0'}
function show(b,photo){lastBlob=b;isPhoto=photo;const u=URL.createObjectURL(b),c=$('revc');c.innerHTML='';const el=document.createElement(photo?'img':'video');el.src=u;if(!photo){el.controls=true;el.autoplay=true;el.loop=true;el.playsInline=true}c.appendChild(el);$('rev').style.display='flex'}
$('retake').onclick=()=>{$('rev').style.display='none';$('revc').innerHTML=''};
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=isPhoto?'fact-tok.jpg':'fact-tok.webm';a.click()};
$('gf').onchange=e=>{const f=e.target.files[0];if(f){show(f,f.type.startsWith('image'))}};
pick(0,false);cam();initFace();requestAnimationFrame(frame);
</script></body></html>
