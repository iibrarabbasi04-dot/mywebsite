#prog{position:fixed;top:0;left:0;height:4px;background:#fffc00;width:0;z-index:5}

#car::-webkit-scrollbar{display:none}
.fx{flex:0 0 auto;scroll-snap-align:center;margin:0 7px;width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.6);overflow:hidden;background:#333;transition:width .15s,height .15s,margin .15s}
.fx canvas{width:100%;height:100%;display:block;pointer-events:none}
.fx.sel{width:92px;height:92px;margin:0 3px;border:5px solid #fff}
body.vm .fx.sel{border-color:#ff2d55}body.rec .fx.sel{border-radius:26px;border-color:#ff2d55}
#modes{display:flex;justify-content:center;gap:12px;font-weight:700;font-size:15px;color:#ccc;padding:2px 0 4px}
#modes span{padding:7px 22px;border-radius:20px;background:rgba(255,255,255,.14)}#modes .on{background:#fffc00;color:#000}
#tabs{display:flex;justify-content:space-around;padding:6px 8px 10px;font-weight:700;color:#bbb}
#tabs span{padding:6px 14px;border-radius:18px}
#tabs .on{background:#fff;color:#000}
#rev{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#revc{flex:1;display:flex;min-height:0}
#revc video,#revc img{flex:1;min-width:0;width:100%;object-fit:contain}
#rev .b{display:flex;gap:10px;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.btn{flex:1;border:0;border-radius:26px;padding:14px 6px;font-weight:700;font-size:15px;background:#2a2a2a;color:#fff}
.btn.p{background:#fffc00;color:#000}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 16px;border-radius:20px;z-index:40;display:none;text-align:center;max-width:90%}

function frame(t){requestAnimationFrame(frame);
 try{if(vid.readyState>1&&vid.currentTime!==lastVT){lastVT=vid.currentTime;detect()}
 R(ctx,cv.width,cv.height,E[cur],t);
 fn++;if(th.length){if(fn%2===0){const s=th.find(k=>k.i===cur);if(s)thumb(s,t)}else for(let n=0;n<th.length;n++){const k=th[tk++%th.length];if(vis(k)){thumb(k,t);break}}}}
 catch(err){}}
function build(cat){car.innerHTML='';th=[];const L=cat==='All'?E.map((e,i)=>i):[0,...E.map((e,i)=>i).filter(i=>E[i].k===cat)];
 L.forEach(i=>{const d=document.createElement('div');d.className='fx';d.dataset.i=i;const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');x.fillStyle=E[i].c;x.fillRect(0,0,96,96);d.appendChild(c);car.appendChild(d);th.push({i,ctx:x,el:d});d.onclick=()=>{if(!d.classList.contains('sel'))pick(i,true)}});pick(0,true)}
function pick(i,scroll){cur=i;[...car.children].forEach(c=>c.classList.toggle('sel',+c.dataset.i===i));$('name').textContent=E[i].n;
 if(scroll){const c=[...car.children].find(c=>+c.dataset.i===i);if(c)car.scrollTo({left:c.offsetLeft-car.clientWidth/2+c.offsetWidth/2,behavior:'smooth'})}}
let st;car.onscroll=()=>{clearTimeout(st);st=setTimeout(()=>{const mid=car.scrollLeft+car.clientWidth/2;let b=null,bd=1e9;[...car.children].forEach(c=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;b=c}});if(b&&+b.dataset.i!==cur)pick(+b.dataset.i,false)},80)};
document.querySelectorAll('#tabs span').forEach(s=>s.onclick=()=>{document.querySelectorAll('#tabs span').forEach(x=>x.classList.remove('on'));s.classList.add('on');build(s.textContent)});
let hd=0,held=false,vmode=false;car.oncontextmenu=e=>e.preventDefault();
async function cd(){if(timerS){const c=$('cd');c.style.display='grid';for(let i=timerS;i>0;i--){c.textContent=i;await new Promise(r=>setTimeout(r,1000))}c.style.display='none'}}
car.addEventListener('pointerdown',e=>{if(vmode||!e.target.closest('.fx.sel'))return;held=false;hd=setTimeout(()=>{held=true;startRec()},450)});
car.addEventListener('pointerup',async e=>{clearTimeout(hd);if(!e.target.closest('.fx.sel'))return;if(recording){stopRec();return}if(held)return;await cd();if(vmode)startRec();else cv.toBlob(b=>show(b,true),'image/jpeg',.95)});
car.addEventListener('pointercancel',()=>{clearTimeout(hd);if(recording&&!vmode)stopRec()});
document.querySelectorAll('#modes span').forEach(m=>m.onclick=()=>{document.querySelectorAll('#modes span').forEach(x=>x.classList.remove('on'));m.classList.add('on');vmode=m.dataset.m==='v';document.body.classList.toggle('vm',vmode);toast(vmode?'Video: bade circle par ek tap = shuru, dobara tap = band':'Photo: tap = photo, dabaye rakho = video')});
function startRec(){if(recording||!stream)return;const cs=cv.captureStream(30);stream.getAudioTracks().forEach(t=>cs.addTrack(t));
 const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
 parts=[];rec=new MediaRecorder(cs,mt?{mimeType:mt,videoBitsPerSecond:[6e6,12e6,35e6][qi]}:{});rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
 rec.onstop=()=>show(new Blob(parts,{type:rec.mimeType||'video/webm'}),false);rec.start(500);recording=true;document.body.classList.add('rec');toast('Recording... band karne ke liye dobara tap');
 const t0=Date.now();rec._i=setInterval(()=>{const s=(Date.now()-t0)/1000;$('prog').style.width=Math.min(100,s/60*100)+'%';if(s>=60)stopRec()},100)}
function stopRec(){if(!recording)return;recording=false;clearInterval(rec._i);rec.stop();document.body.classList.remove('rec');$('prog').style.width='0'}
function show(b,photo){lastBlob=b;isPhoto=photo;const c=$('revc');c.innerHTML='';const el=document.createElement(photo?'img':'video');el.src=URL.createObjectURL(b);if(!photo){el.controls=true;el.autoplay=true;el.loop=true;el.playsInline=true}c.appendChild(el);$('rev').style.display='flex'}
const fname=()=>'fact-tok-'+Date.now()+(isPhoto?'.jpg':lastBlob.type.includes('mp4')?'.mp4':'.webm');
$('retake').onclick=()=>{$('rev').style.display='none';$('revc').innerHTML=''};
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=fname();a.click()};
// ---- upload: UPLOAD_URL ho to server par, warna phone ka Share menu ----
$('up').onclick=async()=>{const f=new File([lastBlob],fname(),{type:lastBlob.type});
 if(UPLOAD_URL){try{toast('Upload ho raha hai...');const fd=new FormData();fd.append('file',f);const r=await fetch(UPLOAD_URL,{method:'POST',body:fd});if(!r.ok)throw 0;toast('Upload ho gaya ✅')}catch(e){toast('Upload fail hua, dobara try karein')}return}
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}return}
 toast('Upload link set nahi hai, pehle Save karein')};
$('flip').onclick=()=>{front=!front;cam()};
$('flash').onclick=async()=>{try{flashOn=!flashOn;await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:flashOn}]});toast(flashOn?'Flash on':'Flash off')}catch(e){flashOn=false;toast('Is camera mein flash nahi hai')}};
$('timer').onclick=()=>{timerS=timerS===0?3:timerS===3?10:0;toast('Timer: '+(timerS?timerS+'s':'Off'))};
$('beauty').onclick=()=>{beautyOn=!beautyOn;toast(beautyOn?'Beauty on':'Beauty off')};
$('zoom').onclick=()=>{zoom=zoom===1?1.5:zoom===1.5?2:1;$('zoom').textContent=zoom+'x'};
$('qual').onclick=()=>{qi=(qi+1)%3;$('qual').textContent=Q[qi][0];cam()};
if(!FILT)setTimeout(()=>toast('Is browser mein color filters support nahi, Chrome use karein'),1500);
build('All');cam();initFace();requestAnimationFrame(frame);
</script></body></html>
