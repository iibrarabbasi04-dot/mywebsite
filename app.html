<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FACT TOK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1ed760;--bg:#000;--c:#121212;--l:#2a2a2a;--t:#fff;--m:#9a9a9a}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#1c1c1c;border:1px solid var(--l);border-radius:10px;padding:11px;margin:5px 0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g)}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--l)}
.pri{background:var(--g);color:#000;font-weight:800;width:100%;margin-top:6px}
.ft{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:#000;font-weight:800;font-size:12px}
#authBox{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#0b3d1c,#000 60%);padding:14px;overflow:auto}
.glass{width:100%;max-width:400px;background:#ffffff0d;backdrop-filter:blur(14px);border:1px solid #ffffff1f;border-radius:22px;padding:22px;text-align:center}
.glass .ft{width:56px;height:56px;font-size:22px;margin-bottom:12px}
.tabs,.seg{display:flex;gap:6px;background:#1c1c1c;border-radius:30px;padding:4px;margin:10px 0}
.tabs button,.seg button{flex:1;background:none;border-radius:30px;color:var(--m);font-weight:600}
.tabs .on,.seg .on{background:var(--g);color:#000}
#otpArea{margin-top:12px;border-top:1px solid var(--l);padding-top:10px}#otpMsg{color:var(--g);margin-bottom:6px}
#appBox{position:fixed;inset:0;display:flex;flex-direction:column}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--l);background:#000}
#ftLogo{display:flex;align-items:center;gap:7px;font-weight:800;cursor:pointer;user-select:none;white-space:nowrap}
#search{flex:1;border-radius:30px;margin:0;padding:8px 14px}
.coin{display:flex;align-items:center;gap:5px;font-weight:700}
.up{background:var(--g);color:#000;font-weight:800;padding:8px 12px}
.top{height:40px;display:flex;justify-content:center;gap:22px;align-items:center}
.top button{background:none;color:var(--m);font-weight:600;border-radius:0;padding:8px 2px}.top .on{color:#fff;border-bottom:2px solid var(--g)}
#feed{height:calc(100vh - 152px);overflow-y:scroll;scroll-snap-type:y mandatory;max-width:480px;width:100%;margin:0 auto;scrollbar-width:none}
.reel{height:calc(100vh - 158px);scroll-snap-align:start;position:relative;background:#111;margin-bottom:6px;overflow:hidden;border-radius:12px}
.reel video{width:100%;height:100%;object-fit:cover}.fact{height:100%;display:grid;place-items:center;padding:30px 70px 110px 24px;font-size:22px;font-weight:800;line-height:1.35}
.side{position:absolute;right:8px;bottom:90px;display:flex;flex-direction:column;gap:16px;align-items:center}
.side button{background:none;padding:0;font-size:28px;text-align:center}.side small{display:block;font-size:12px;font-weight:600}
.avatar{position:relative;width:48px;height:48px;margin-bottom:12px}.avatar img,.dp{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--g);display:grid;place-items:center;color:#000;font-weight:800;border:2px solid #fff}
.followBtn{position:absolute;left:14px;bottom:-9px;width:20px;height:20px;border-radius:50%;background:#fe2c55;color:#fff;font-size:14px;line-height:20px;text-align:center;cursor:pointer}
.cap{position:absolute;left:12px;right:80px;bottom:14px;text-shadow:0 1px 4px #000}.cap b{font-size:15px}.tag{color:var(--g);font-weight:600}
.watermark{position:absolute;right:10px;bottom:8px;font-size:11px;display:flex;align-items:center;gap:5px;opacity:.85}.watermark .ft{width:18px;height:18px;font-size:8px}
nav{height:56px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--l);background:#000;max-width:480px;width:100%;margin:0 auto}
nav button{background:none;color:var(--m);font-size:12px;padding:4px 8px}nav .on{color:#fff}
nav .plus{background:linear-gradient(90deg,#25f4ee 30%,#fe2c55 70%);color:#000;font-size:22px;font-weight:800;padding:2px 14px;border-radius:10px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}
.sheet{background:var(--c);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.sheet h3{margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.list button{display:block;width:100%;text-align:left;background:none;border-bottom:1px solid var(--l);border-radius:0;padding:14px 4px}
.row{display:flex;gap:8px}.row>*{flex:1}.stat{text-align:center;margin:12px 0}.stat b{display:block;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid div{aspect-ratio:3/4;background:#1c1c1c;font-size:11px;padding:6px;overflow:hidden;border-radius:6px}
.cm{padding:8px 0;border-bottom:1px solid var(--l)}.cm b{color:var(--g)}.m{color:var(--m)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--g);color:#000;font-weight:700;padding:10px 18px;border-radius:30px;z-index:99;display:none}
.adm{border:1px solid var(--l);border-radius:10px;padding:10px;margin:8px 0}
.ft{box-shadow:0 0 12px #1ed76088}#appName{text-shadow:0 0 10px #1ed76077;letter-spacing:.5px}.top .on{border-image:linear-gradient(90deg,#1ed760,#25f4ee) 1}
.scr{position:fixed;inset:0;background:#000;z-index:70;display:none;flex-direction:column}.scr.on{display:flex}
.scr video{width:100%;height:100%;object-fit:cover}#draftModal{z-index:90}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:3}
.bar button{background:#0008;border-radius:50%;width:40px;height:40px;padding:0;font-size:18px}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#111}
.fstrip{display:flex;gap:10px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.fchip{flex:0 0 auto;text-align:center;font-size:10px;cursor:pointer;width:50px}.fchip i{display:block;width:44px;height:44px;margin:0 auto 3px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,#1ed760,#ff7a00,#25f4ee)}.fchip.on i{border-color:#fff}
.cambtm{display:flex;justify-content:space-around;align-items:center;padding:6px 0 22px;background:#000}.cambtm>button:not(.rec){width:50px;height:50px;border-radius:12px;padding:0;font-size:20px}
.rec{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:none;padding:0;display:grid;place-items:center}.rec b{width:56px;height:56px;border-radius:50%;background:#fe2c55;transition:.2s}.rec.on b{width:28px;height:28px;border-radius:8px}
#edOv{position:absolute;inset:0;pointer-events:none}.ov{position:absolute;transform:translate(-50%,-50%);font-weight:800;text-shadow:0 1px 4px #000;white-space:nowrap;pointer-events:auto;touch-action:none}.reel .ov{pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px #000}
.e-shake{animation:shk .25s infinite}.e-pulse{animation:pls .8s infinite}.e-mirror{transform:scaleX(-1)}.e-flip{transform:scaleY(-1)}
@keyframes shk{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}@keyframes pls{50%{transform:scale(1.08)}}
.tools{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px;background:#000}.tools button{flex:0 0 auto;background:#1c1c1c;font-size:12px;padding:8px 12px}
.tools .on,.panel .on{background:var(--g);color:#000}
.panel{padding:6px 12px;min-height:100px;background:#000}.panel label{display:flex;align-items:center;gap:8px;font-size:12px}.panel label input{padding:0;margin:4px 0}.panel button{margin:2px;font-size:12px;padding:8px 12px}
.gal{position:relative;width:50px;height:50px;border-radius:12px;background:var(--l);display:grid;place-items:center;font-size:20px}.gal input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer}.ghost{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}.modes{display:flex;justify-content:center;gap:26px;background:#000;padding-bottom:14px}.modes button{background:none;color:var(--m);font-weight:800;padding:4px;border-radius:0}.modes .on{color:#fff;border-bottom:2px solid var(--g)}.rec b{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}#liveChat div{margin:3px 0}</style></head><body>

<div id="authBox"><div class="glass"><div class="ft">FT</div>
<div class="tabs"><button id="tLi" class="on" onclick="showMain('li')">LOGIN</button><button id="tSu" onclick="showMain('su')">SIGN UP</button></div>
<div id="pLi"><div class="seg"><button id="liBp" class="on" onclick="showLi('p')">Phone</button><button id="liBg" onclick="showLi('g')">Gmail</button></div>
<div id="liP"><select id="liCC"></select><input id="liPhone" placeholder="Phone" inputmode="tel"><input id="liPassP" type="password" placeholder="Password"><button class="pri" onclick="loginPhone()">Log in</button></div>
<div id="liG" hidden><input id="liEmail" type="email" placeholder="Gmail"><input id="liPassG" type="password" placeholder="Password"><button class="pri" onclick="loginGmail()">Log in</button></div></div>
<div id="pSu" hidden><div class="seg"><button id="suBp" class="on" onclick="showSu('p')">Phone</button><button id="suBg" onclick="showSu('g')">Gmail</button></div>
<div id="suP"><input id="suNameP" placeholder="Name"><select id="suCC"></select><input id="suPhone" placeholder="Phone" inputmode="tel"><input id="suPassP" type="password" placeholder="Password (6+ characters)"><input id="suCPassP" type="password" placeholder="Confirm password"><button class="pri" onclick="signupPhone()">Create account</button></div>
<div id="suG" hidden><input id="suNameG" placeholder="Name"><input id="suEmailG" type="email" placeholder="Gmail"><input id="suPassG" type="password" placeholder="Password (6+ characters)"><input id="suCPassG" type="password" placeholder="Confirm password"><button class="pri" onclick="signupGmail()">Create account</button></div></div>
<div id="otpArea" style="display:none"><p id="otpMsg"></p><input id="otpInput" placeholder="6-digit code" inputmode="numeric"><div class="row"><button class="pri" onclick="verifyOtp()">Verify</button><button onclick="resendOtp()" style="margin-top:6px">Resend</button></div></div>
</div></div>

<div id="appBox" hidden>
<header><div id="ftLogo" onclick="logoTap()"><span class="ft">FT</span><span id="appName"></span></div><input id="search" placeholder="Search facts, users, #tags" oninput="renderFeed()"><div class="coin"><span class="ft">FT</span><span id="coinCount">0</span></div><button class="up" onclick="openUpload()">+</button></header>
<div class="top" id="topTabs"><button class="on" data-t="foryou" onclick="setTab('foryou')">For You</button><button data-t="following" onclick="setTab('following')">Following</button><button data-t="community" onclick="setTab('community')">Community</button><button data-t="stem" onclick="setTab('stem')">STEM</button></div>
<div id="feed"></div>
<nav><button id="nHome" class="on" onclick="setTab('foryou')">🏠<br>Home</button><button onclick="setTab('following')">👥<br>Friends</button><button class="plus" onclick="openUpload()">+</button><button onclick="openInbox()">✉️<br>Inbox 99+</button><button onclick="showUser()">👤<br>Profile</button></nav></div>

<div class="modal" id="commentModal"><div class="sheet"><h3><span id="cmTitle">Comments</span><button onclick="closeM('commentModal')">✕</button></h3><div id="cmList"></div><div class="row"><input id="cmInput" placeholder="Add comment..." style="flex:3"><button class="pri" onclick="postComment()" style="margin:5px 0">Post</button></div></div></div>

<div class="modal" id="shareModal"><div class="sheet"><h3>Share to<button onclick="closeM('shareModal')">✕</button></h3><div class="list">
<button onclick="openReportModal()">🚩 Report</button><button onclick="repostVideo()">🔁 Repost</button><button onclick="downloadVideo()">⬇️ Download</button><button onclick="shareTo('wa')">🟢 WhatsApp</button><button onclick="shareTo('tw')">🐦 Twitter</button><button onclick="shareTo('fb')">📘 Facebook</button><button onclick="shareTo('ig')">📸 Instagram (copy link)</button></div></div></div>

<div class="modal" id="reportModal"><div class="sheet"><h3>Report video<button onclick="closeM('reportModal')">✕</button></h3><select id="rpReason"><option>Nudity</option><option>Violence</option><option>Spam</option><option>Harassment</option><option>Fake</option></select><textarea id="rpDesc" rows="3" placeholder="Tell us what happened"></textarea><button class="pri" onclick="submitReport()">Submit report</button></div></div>

<div class="modal" id="profileModal"><div class="sheet"><h3><span>Profile</span><span><button id="dotsBtn" onclick="openProfileSettings()">•••</button> <button onclick="closeM('profileModal')">✕</button></span></h3><div id="profBody"></div></div></div>

<div class="modal" id="editProfileModal"><div class="sheet"><h3>Edit profile<button onclick="closeM('editProfileModal')">✕</button></h3><input id="epName" placeholder="Name"><input id="epBio" placeholder="Bio"><div style="text-align:center"><div style="position:relative;width:96px;height:96px;margin:6px auto"><div id="epPrev" style="width:96px;height:96px"></div><input id="epFile" type="file" accept="image/*" onchange="pickDp(this)" style="position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;border:0;border-radius:50%"></div><small class="m">Tap the picture to choose a new one</small></div><button class="pri" onclick="saveProfile()">Save</button></div></div>
<div class="modal" id="editBioModal"><div class="sheet"><h3>Edit description<button onclick="closeM('editBioModal')">✕</button></h3><textarea id="ebText" rows="4" maxlength="160" placeholder="Write your bio"></textarea><button class="pri" onclick="saveBio()">Save</button></div></div>

<div class="modal" id="profileSettingsModal"><div class="sheet"><h3>Settings<button onclick="closeM('profileSettingsModal')">✕</button></h3><div class="list">
<button onclick="openBalance()">💰 Balance</button>
<button onclick="document.getElementById('privateToggle').click()">🔒 Private account <input type="checkbox" id="privateToggle" style="width:auto;float:right" onclick="event.stopPropagation();togglePrivate(this.checked)"></button>
<button onclick="document.getElementById('dlToggle').click()">⬇️ Allow downloads <input type="checkbox" id="dlToggle" style="width:auto;float:right" onclick="event.stopPropagation();toggleDl(this.checked)"></button>
<button onclick="closeM('profileSettingsModal');openInbox()">🔔 Notifications</button><button onclick="logout()">🚪 Log out</button></div></div></div>

<div class="modal" id="balanceModal"><div class="sheet"><h3>Balance: <span id="balCoins"></span> FT<button onclick="closeM('balanceModal')">✕</button></h3>
<p class="m" id="payInfo"></p><select id="coinAcc"><option>Easypaisa</option><option>JazzCash</option></select><input id="coinOrderName" placeholder="Account holder name"><input id="coinOrderCoins" type="number" min="1" placeholder="Coins to order" oninput="calcPrice()"><p>Price: Rs <b id="coinPrice">0</b></p><button class="pri" id="coinOrderSubmit" onclick="submitCoinOrder()">Submit order</button></div></div>

<div class="modal" id="uploadModal"><div class="sheet"><h3>New video<button onclick="closeM('uploadModal')">✕</button></h3><textarea id="upCap" rows="2" placeholder="Caption"></textarea><input id="upTags" placeholder="#facts #stem #community"><input id="upLoc" placeholder="📍 Location"><input id="upUrl" placeholder="Video URL (optional)"><input id="upFile" type="file" accept="video/*"><label><input type="checkbox" id="upDl" checked style="width:auto"> Allow downloads</label><button class="pri" onclick="postVideo()">Post</button></div></div>

<div class="modal" id="inboxModal"><div class="sheet"><h3>Inbox<button onclick="closeM('inboxModal')">✕</button></h3><div id="inboxList"></div></div></div>
<div class="modal" id="adminModal"><div class="sheet"><h3>Admin<button onclick="closeM('adminModal')">✕</button></h3><div class="row"><button onclick="renderAdmin('orders')">Orders</button><button onclick="renderAdmin('users')">Users</button><button onclick="renderAdmin('reports')">Reports</button></div><div id="admBody"></div></div></div>
<div class="scr" id="camScreen"><div class="bar"><button onclick="closeCam()">✕</button><span class="ft" style="width:38px;height:38px">FT</span><button onclick="flipCam()">🔄</button></div>
<div class="stage"><video id="camV" autoplay playsinline muted></video><div id="recT" style="position:absolute;top:64px;left:50%;transform:translateX(-50%);font-weight:800;text-shadow:0 1px 4px #000"></div></div>
<div class="fstrip" id="camStrip" style="background:#000"></div>
<div class="cambtm"><div class="gal">🖼️<input id="vidFile" type="file" accept="video/*" onchange="pickVideo(this)" title="Gallery"></div><input id="capFile" type="file" accept="video/*" capture="user" class="ghost" onchange="pickVideo(this)"><button class="rec" id="recBtn" onclick="toggleRec()"><b></b></button><button onclick="openDrafts()" title="Drafts">📝</button></div>
<div class="modes"><button id="mdPost" class="on" onclick="setMode('post')">POST</button><button id="mdLive" onclick="setMode('live')">LIVE</button></div></div>

<div class="scr" id="edScreen"><div class="bar"><button onclick="closeEd()">←</button><b>Edit</b><span style="width:40px"></span></div>
<div class="stage" id="edStage"><video id="edV" loop playsinline onclick="this.paused?this.play():this.pause()"></video><div id="edOv"></div></div>
<div class="tools" id="edTools"><button data-t="f" onclick="edTab('f')">Filters</button><button data-t="a" onclick="edTab('a')">Adjust</button><button data-t="e" onclick="edTab('e')">Effects</button><button data-t="s" onclick="edTab('s')">Speed</button><button data-t="r" onclick="edTab('r')">Trim</button><button data-t="t" onclick="edTab('t')">Text</button><button data-t="k" onclick="edTab('k')">Stickers</button><button data-t="m" onclick="edTab('m')">Sound</button></div>
<div class="panel" id="edPanel"></div>
<div class="row" style="padding:8px 12px 18px;background:#000"><button onclick="saveDraft()">📝 Draft</button><button class="pri" style="margin:0" onclick="openPost()">Post</button></div></div>

<div class="scr" id="postScreen" style="overflow:auto"><div class="bar" style="position:static"><button onclick="closeM('postScreen')">←</button><b>Post</b><span style="width:40px"></span></div>
<div style="padding:0 14px 24px"><div class="row"><textarea id="poCap" rows="5" maxlength="300" placeholder="Describe your video..." style="flex:3"></textarea><video id="poV" muted playsinline style="border-radius:10px;height:130px;margin:5px 0"></video></div>
<div class="row"><button onclick="showTags()"># Hashtags</button><button onclick="showMen()">@ Mention</button></div><div id="poSug" class="fstrip" style="flex-wrap:wrap"></div>
<input id="poLoc" placeholder="📍 Add location"><div class="fstrip"><button onclick="setLoc('Lahore')">📍 Lahore</button><button onclick="setLoc('Karachi')">📍 Karachi</button><button onclick="setLoc('Islamabad')">📍 Islamabad</button><button onclick="setLoc('Dubai')">📍 Dubai</button></div>
<label class="m">Who can watch this video</label><select id="poVis"><option value="all">Everyone</option><option value="me">Only me</option></select>
<label style="display:block;margin:8px 0"><input type="checkbox" id="poCm" checked style="width:auto"> Allow comments</label><label style="display:block;margin:8px 0"><input type="checkbox" id
