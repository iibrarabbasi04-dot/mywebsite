<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FACT TOK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1ed760;--bg:#000;--c:#121212;--l:#2a2a2a;--t:#fff;--m:#9a9a9a}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#1c1c1c;border:1px solid var(--l);border-radius:10px;padding:11px;margin:5px 0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g)}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--l)}
.pri{background:var(--g);color:#000;font-weight:800;width:100%;margin-top:6px}
.ft{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g);color:#000;font-weight:800;font-size:12px}
#authBox{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#0b3d1c,#000 60%);padding:14px;overflow:auto}
.glass{width:100%;max-width:400px;background:#ffffff0d;backdrop-filter:blur(14px);border:1px solid #ffffff1f;border-radius:22px;padding:22px;text-align:center}
.glass .ft{width:56px;height:56px;font-size:22px;margin-bottom:12px}
.tabs,.seg{display:flex;gap:6px;background:#1c1c1c;border-radius:30px;padding:4px;margin:10px 0}
.tabs button,.seg button{flex:1;background:none;border-radius:30px;color:var(--m);font-weight:600}
.tabs .on,.seg .on{background:var(--g);color:#000}
#otpArea{margin-top:12px;border-top:1px solid var(--l);padding-top:10px}#otpMsg{color:var(--g);margin-bottom:6px}
#appBox{position:fixed;inset:0;display:flex;flex-direction:column}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--l);background:#000}
#ftLogo{display:flex;align-items:center;gap:7px;font-weight:800;cursor:pointer;user-select:none;white-space:nowrap}
#search{flex:1;border-radius:30px;margin:0;padding:8px 14px}
.coin{display:flex;align-items:center;gap:5px;font-weight:700}
.up{background:var(--g);color:#000;font-weight:800;padding:8px 12px}
.top{height:40px;display:flex;justify-content:center;gap:22px;align-items:center}
.top button{background:none;color:var(--m);font-weight:600;border-radius:0;padding:8px 2px}.top .on{color:#fff;border-bottom:2px solid var(--g)}
#feed{height:calc(100vh - 152px);overflow-y:scroll;scroll-snap-type:y mandatory;max-width:480px;width:100%;margin:0 auto;scrollbar-width:none}
.reel{height:calc(100vh - 158px);scroll-snap-align:start;position:relative;background:#111;margin-bottom:6px;overflow:hidden;border-radius:12px}
.reel video{width:100%;height:100%;object-fit:cover}.fact{height:100%;display:grid;place-items:center;padding:30px 70px 110px 24px;font-size:22px;font-weight:800;line-height:1.35}
.side{position:absolute;right:8px;bottom:90px;display:flex;flex-direction:column;gap:16px;align-items:center}
.side button{background:none;padding:0;font-size:28px;text-align:center}.side small{display:block;font-size:12px;font-weight:600}
.avatar{position:relative;width:48px;height:48px;margin-bottom:12px}.avatar img,.dp{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--g);display:grid;place-items:center;color:#000;font-weight:800;border:2px solid #fff}
.followBtn{position:absolute;left:14px;bottom:-9px;width:20px;height:20px;border-radius:50%;background:#fe2c55;color:#fff;font-size:14px;line-height:20px;text-align:center;cursor:pointer}
.cap{position:absolute;left:12px;right:80px;bottom:14px;text-shadow:0 1px 4px #000}.cap b{font-size:15px}.tag{color:var(--g);font-weight:600}
.watermark{position:absolute;right:10px;bottom:8px;font-size:11px;display:flex;align-items:center;gap:5px;opacity:.85}.watermark .ft{width:18px;height:18px;font-size:8px}
nav{height:56px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--l);background:#000;max-width:480px;width:100%;margin:0 auto}
nav button{background:none;color:var(--m);font-size:12px;padding:4px 8px}nav .on{color:#fff}
nav .plus{background:linear-gradient(90deg,#25f4ee 30%,#fe2c55 70%);color:#000;font-size:22px;font-weight:800;padding:2px 14px;border-radius:10px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}
.sheet{background:var(--c);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.sheet h3{margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.list button{display:block;width:100%;text-align:left;background:none;border-bottom:1px solid var(--l);border-radius:0;padding:14px 4px}
.row{display:flex;gap:8px}.row>*{flex:1}.stat{text-align:center;margin:12px 0}.stat b{display:block;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid div{aspect-ratio:3/4;background:#1c1c1c;font-size:11px;padding:6px;overflow:hidden;border-radius:6px}
.cm{padding:8px 0;border-bottom:1px solid var(--l)}.cm b{color:var(--g)}.m{color:var(--m)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--g);color:#000;font-weight:700;padding:10px 18px;border-radius:30px;z-index:99;display:none}
.adm{border:1px solid var(--l);border-radius:10px;padding:10px;margin:8px 0}
.ft{box-shadow:0 0 12px #1ed76088}#appName{text-shadow:0 0 10px #1ed76077;letter-spacing:.5px}.top .on{border-image:linear-gradient(90deg,#1ed760,#25f4ee) 1}
.scr{position:fixed;inset:0;background:#000;z-index:70;display:none;flex-direction:column}.scr.on{display:flex}
.scr video{width:100%;height:100%;object-fit:cover}#draftModal{z-index:90}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:3}
.bar button{background:#0008;border-radius:50%;width:40px;height:40px;padding:0;font-size:18px}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#111}
.fstrip{display:flex;gap:10px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.fchip{flex:0 0 auto;text-align:center;font-size:10px;cursor:pointer;width:50px}.fchip i{display:block;width:44px;height:44px;margin:0 auto 3px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,#1ed760,#ff7a00,#25f4ee)}.fchip.on i{border-color:#fff}
.cambtm{display:flex;justify-content:space-around;align-items:center;padding:6px 0 22px;background:#000}.cambtm>button:not(.rec){width:50px;height:50px;border-radius:12px;padding:0;font-size:20px}
.rec{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:none;padding:0;display:grid;place-items:center}.rec b{width:56px;height:56px;border-radius:50%;background:#fe2c55;transition:.2s}.rec.on b{width:28px;height:28px;border-radius:8px}
#edOv{position:absolute;inset:0;pointer-events:none}.ov{position:absolute;transform:translate(-50%,-50%);font-weight:800;text-shadow:0 1px 4px #000;white-space:nowrap;pointer-events:auto;touch-action:none}.reel .ov{pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px #000}
.e-shake{animation:shk .25s infinite}.e-pulse{animation:pls .8s infinite}.e-mirror{transform:scaleX(-1)}.e-flip{transform:scaleY(-1)}
@keyframes shk{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}@keyframes pls{50%{transform:scale(1.08)}}
.tools{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px;background:#000}.tools button{flex:0 0 auto;background:#1c1c1c;font-size:12px;padding:8px 12px}
.tools .on,.panel .on{background:var(--g);color:#000}
.panel{padding:6px 12px;min-height:100px;background:#000}.panel label{display:flex;align-items:center;gap:8px;font-size:12px}.panel label input{padding:0;margin:4px 0}.panel button{margin:2px;font-size:12px;padding:8px 12px}
.gal{position:relative;width:50px;height:50px;border-radius:12px;background:var(--l);display:grid;place-items:center;font-size:20px}.gal input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer}.ghost{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}.modes{display:flex;justify-content:center;gap:26px;background:#000;padding-bottom:14px}.modes button{background:none;color:var(--m);font-weight:800;padding:4px;border-radius:0}.modes .on{color:#fff;border-bottom:2px solid var(--g)}.rec b{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}#liveChat div{margin:3px 0}</style></head><body>

<script>
const FACTTOK_CONFIG={appName:"FACT TOK",logoText:"FT",adminGmail:"iibrarabbasi04@gmail.com",hideAdminGmailFromUsers:true,
countryCodes:["+92 Pakistan","+91 India","+971 UAE","+966 Saudi Arabia","+44 UK","+1 USA","+86 China","+81 Japan","+90 Turkey","+49 Germany","+33 France","+61 Australia","+880 Bangladesh","+94 Sri Lanka","+977 Nepal","+98 Iran","+60 Malaysia","+62 Indonesia","+27 South Africa","+55 Brazil"],
blueTickRule:{followers:1000000,likes:1000000},coinSymbol:"FT",
coinPackages:[{coins:100,price:100},{coins:500,price:450},{coins:1000,price:850},{coins:5000,price:4000},{coins:10000,price:7500}],
easypaisaInfo:"Easypaisa: 03279128541 - Name: Ibrar Abbasi",jazzCashInfo:"JazzCash: 03279128541 - Name: Ibrar Abbasi"};
const CONFIG=FACTTOK_CONFIG,$=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Storage full - use a shorter video or a URL');return false}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let users=ld('facttok_users',[]),currentUser=null,videos=[],otpCode='',tempUser=null,selId=null,tab='foryou',taps=[],viewing=null,admTab='orders';
const getU=e=>users.find(u=>u.email===e);
const vid=id=>videos.find(v=>v.id==id);
function saveAll(){sv('facttok_users',users);sv('facttok_videos',videos);if(currentUser)sv('facttok_current_user',currentUser)}
function toast(m){const t=$('toast');t.innerText=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
window.openM=id=>$(id).classList.add('on');window.closeM=id=>$(id).classList.remove('on');

/* ---------- 216 FILTERS + FX ---------- */
const FN=[['Normal',''],['B&W','grayscale(1) contrast(1.1)'],['Sepia','sepia(.8)'],['Vintage','sepia(.4) contrast(1.1) saturate(.8) hue-rotate(-10deg)'],['Neon','saturate(2) contrast(1.2) hue-rotate(290deg)'],['Warm','sepia(.25) saturate(1.3) brightness(1.05)'],['Cool','hue-rotate(180deg) saturate(.9) brightness(1.05)'],['Fade','contrast(.8) brightness(1.15) saturate(.7)'],['Drama','contrast(1.4) saturate(1.2) brightness(.9)'],['Noir','grayscale(1) contrast(1.6) brightness(.85)'],['Pop','saturate(2.2) contrast(1.15)'],['Dream','brightness(1.15) saturate(1.3) blur(.5px)'],['Sunset','sepia(.5) saturate(1.8) hue-rotate(-20deg)'],['Ocean','hue-rotate(160deg) saturate(1.4)'],['Forest','hue-rotate(80deg) saturate(1.3)'],['Glow','brightness(1.2) contrast(.9) saturate(1.3)']];
const FILTERS=FN.map(a=>({n:a[0],css:a[1]}));
for(let i=0;FILTERS.length<216;i++)FILTERS.push({n:'FT '+(FILTERS.length+1),css:`hue-rotate(${(i*37)%360}deg) saturate(${90+(i%7)*18}%) contrast(${92+(i%5)*7}%) brightness(${92+(i%4)*6}%)${i%9===0?' grayscale(.6)':''}${i%11===0?' sepia(.5)':''}`});
const newFx=f=>({f:f||0,adj:{br:100,co:100,sa:100,bl:0,hu:0,sep:0},eff:'',speed:1,start:0,end:0,vol:100,items:[]});

    var v=vid(selId),me=currentUser;$('cmTitle').innerText=v.comments.length+' comments';
    $('cmList').innerHTML=v.comments.map(function(c,i){var can=c.u===me.username||v.owner===me.email||me.email===CONFIG.adminGmail;
      return '<div class="cm" style="display:flex;gap:8px"><div style="flex:1"><b>@'+esc(c.u)+'</b> '+esc(c.t)+'</div>'+(can?'<button style="padding:2px 8px;background:none" onclick="ftDelCm('+i+')">🗑</button>':'')+'</div>'}).join('')||'<p class="m">Be the first to comment.</p>'};
  window.ftDelCm=function(i){var v=vid(selId);if(!v||!confirm('Ye comment delete karein?'))return;v.comments.splice(i,1);saveAll();drawComments();renderFeed();toast('Comment delete ho gaya')};

  /* 4) Search button -> alag search bar (full screen) */
  var sbtn=document.createElement('button');sbtn.id='ftSearchBtn';sbtn.textContent='🔍';sbtn.onclick=openSearch;
  document.querySelector('header').insertBefore(sbtn,document.querySelector('header .coin'));
  function openSearch(){
    var s=sh('<div style="display:flex;gap:8px;align-items:center"><input id="ftQ" placeholder="Search facts, users, #tags" style="margin:0"><button id="ftQx">✕</button></div><div id="ftRes"></div>');
    s.style.alignItems='stretch';s.firstElementChild.style.cssText='max-width:480px;height:100%;max-height:100%;border-radius:0;padding:14px;background:#000';
    var picked=false;
    function res(){var q=$('ftQ').value.toLowerCase().trim();
      if(!q){$('ftRes').innerHTML='<p class="m" style="padding:20px 0">Naam, @username ya #tag likhein.</p>';return}
      var us=users.filter(function(u){return !u.banned&&(u.name+' '+u.username).toLowerCase().indexOf(q.replace('@',''))>-1});
      var vs=videos.filter(function(v){return v.vis!=='me'&&(v.caption+' '+v.tags).toLowerCase().indexOf(q)>-1});
      $('ftRes').innerHTML=(us.length?'<div class="fth" style="margin-top:12px">Users</div>'+us.map(rowU).join(''):'')+(vs.length?'<div class="fth" style="margin-top:12px">Videos</div>'+vs.map(function(v){return '<div class="ftrow"><div class="nm" data-v="1">'+esc(v.caption||'Video')+'<div class="tag">'+esc(v.tags)+'</div></div></div>'}).join(''):'')||'<p class="m" style="padding:20px 0">Kuch nahi mila.</p>'}
    $('ftQ').oninput=res;res();
    $('ftQx').onclick=function(){$('search').value='';renderFeed();s.remove()};
    s.addEventListener('click',function(e){var v=e.target.closest('[data-v]');if(v){$('search').value=$('ftQ').value;renderFeed();s.remove();toast('Search result dikha diye')}});
    wire(s,res);setTimeout(function(){$('ftQ').focus()},100)}

  /* 5) Share menu: har option ke saath rangeen icon */
  var L=document.querySelector('#shareModal .list');
  if(L){var it=[['#fe2c55','🚩','Report','openReportModal()'],['#25f4ee','🔁','Repost','repostVideo()'],['#1ed760','⬇️','Download','downloadVideo()'],['#25d366','💬','WhatsApp',"shareTo('wa')"],['#1d9bf0','🐦','Twitter',"shareTo('tw')"],['#1877f2','📘','Facebook',"shareTo('fb')"],['#e1306c','📸','Instagram (copy link)',"shareTo('ig')"],['#555','🔗','Copy link',"shareTo('cp')"]];
    L.innerHTML=it.map(function(a){return '<button onclick="'+a[3]+'"><span class="ftic" style="background:'+a[0]+'">'+a[1]+'</span>'+a[2]+'</button>'}).join('')}

  /* 6) Video ko 2 second dabane par Save option */
  var HOLD=2000,timer=null,sx=0,sy=0,swallow=false;
  function videoAt(x,y){var l=document.elementsFromPoint(x,y);for(var i=0;i<l.length;i++){if(l[i].tagName==='VIDEO'&&l[i].dataset.i)return l[i]}return null}
  function openHold(el){
    var V=vid(el.dataset.i);if(!V)return;
    var s=sh('<div class="fth"><span>Video options</span></div><button class="pri" id="ftH1">⬇️ Video download karein</button><button id="ftH2" style="width:100%;margin-top:10px;padding:14px">🔖 Profile mein save karein</button><button id="ftH3" style="width:100%;margin-top:10px;padding:14px">✖ Cancel</button>');
    $('ftH3').onclick=function(){s.remove()};
    $('ftH2').onclick=function(){s.remove();if(currentUser.saved.indexOf(V.id)<0)window.saveVideo(V.id);else toast('Pehle se saved hai')};
    $('ftH1').onclick=function(){s.remove();var o=getU(V.owner);if(V.allowDownload===false||(o&&o.allowDownload===false))return toast('Is video ka download band hai');burnDL(V)}}
  function cancel(){clearTimeout(timer);timer=null}
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('button,a,input,textarea,select,.ftsh,.modal,.scr'))return;
    var v=videoAt(e.clientX,e.clientY);if(!v)return;sx=e.clientX;sy=e.clientY;cancel();
    timer=setTimeout(function(){timer=null;swallow=true;if(navigator.vibrate)navigator.vibrate(40);openHold(v)},HOLD)},true);
  document.addEventListener('pointermove',function(e){if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>12)cancel()},true);
  ['pointerup','pointercancel','scroll','touchmove'].forEach(function(n){document.addEventListener(n,cancel,true)});
  document.addEventListener('click',function(e){if(swallow){swallow=false;e.stopPropagation();e.preventDefault()}},true);
  document.addEventListener('contextmenu',function(e){if(videoAt(e.clientX,e.clientY))e.preventDefault()},true);
})();
</script>
</body></html>
